name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Conferir que a tag casa com a versao do pom
        run: |
          POM_VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pom=$POM_VERSION tag=$TAG_VERSION"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME nao casa com a versao do pom ($POM_VERSION)"
            exit 1
          fi

      - run: mvn -B clean package

      - name: Copia sem versao no nome (para a URL latest/download)
        run: cp "target/ItensDaniel-${GITHUB_REF_NAME#v}.jar" "target/ItensDaniel.jar"

      - name: Empacotar o resourcepack
        run: ./empacotar.sh

      - name: Montar as notas com o SHA-1 do pack
        run: |
          PACK_SHA1="$(sha1sum target/ItensDaniel-resourcepack.zip | cut -d' ' -f1)"
          PACK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ItensDaniel-resourcepack.zip"
          {
            echo "## Instalacao"
            echo
            echo "1. Coloque \`ItensDaniel.jar\` em \`plugins/\` e reinicie o servidor."
            echo "2. Para os jogadores verem as texturas, adicione ao \`server.properties\`:"
            echo
            echo '```properties'
            echo "resource-pack=${PACK_URL}"
            echo "resource-pack-sha1=${PACK_SHA1}"
            echo "require-resource-pack=false"
            echo '```'
            echo
            echo "> O SHA-1 muda a cada release do pack. Sem ele atualizado, o cliente fica com a versao antiga em cache."
          } > release-notes.md
          cat release-notes.md

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/ItensDaniel-${GITHUB_REF_NAME#v}.jar" \
            "target/ItensDaniel.jar" \
            "target/ItensDaniel-resourcepack.zip" \
            --title "ItensDaniel $GITHUB_REF_NAME" \
            --notes-file release-notes.md
