# ItensDaniel - configuracao

# Formato deste arquivo. Nao edite: o plugin usa para migrar configs antigas.
versao-config: 2

# Cada entrada vira um item que pode ser entregue com /itens dar <id>.
#
#   nome              nome exibido
#   cor               cor do nome, em hex
#   material          material do vanilla, ex: BLAZE_ROD, NETHERITE_SWORD
#   descricao         linhas de lore
#   brilho            brilho de encantamento sem encantar de verdade
#   inquebravel       o item nao gasta durabilidade
#   modelo            textura propria, vinda do resource pack em resourcepack/ (componente
#                     item_model). Ja vem ligada: o pack sai publicado junto do release e o
#                     servidor entrega aos jogadores pelo server.properties. Se o pack nao
#                     estiver chegando, o item aparece como textura faltando (o quadriculado
#                     roxo e preto) - nesse caso comente a chave. Jogador de Bedrock precisa
#                     do .mcpack e dos mappings do Geyser; ver "Jogadores de Bedrock" no README.
#   custom-model-data numero, para packs no formato antigo (anteriores a 1.21.4)
#   cooldown-segundos espera entre usos dos poderes de clique direito
#   multiferramenta   mina qualquer bloco rapido e com o drop certo, seja espada ou picareta
#   atributos         modificadores aplicados pelo proprio jogo (vida, dano, velocidade...).
#                     ATENCAO: declarar atributos substitui os do material. Uma espada de
#                     netherita com 'atributos' perde o dano dela se voce nao repetir aqui.
#   poderes           lista de poderes; cada tipo ja sabe quando dispara
#
# Poderes de CLIQUE DIREITO (respeitam o cooldown):
#   RAIO           alcance
#   TELEPORTE      alcance
#   BOLA_DE_FOGO   potencia, velocidade, incendiario, quebra-blocos
#   CURA           fator (pontos de vida; 2 = um coracao)
#   IMPULSO        fator (forca do arremesso; ja vem com queda lenta)
#
# Poderes PASSIVOS (valem enquanto o item esta na mao ou vestido):
#   EFEITO         efeito (nome do vanilla: speed, night_vision, ...), nivel
#   VOO            -
#   LUZ            - (acende o lugar onde o jogador esta)
#   IMA            alcance (raio que puxa os itens caidos)
#
# Poderes de MINERACAO:
#   QUEBRA_INDESTRUTIVEL  - (botao esquerdo; quebra ate bedrock)
#   AREA                  alcance como raio (1 = 3x3, 2 = 5x5)
#   FUNDIR                - (o drop ja sai fundido)
#
# Poderes de COMBATE:
#   ROUBO_DE_VIDA  fator (fracao do dano virada em vida) - ao acertar
#   CONGELAR       nivel, duracao-ticks - ao acertar
#   EMPURRAO       fator (forca) - ao ser acertado
itens:

  varinha-tempestade:
    nome: "Varinha da Tempestade"
    cor: "#7FD4FF"
    material: BLAZE_ROD
    modelo: itensdaniel:varinha-tempestade
    descricao:
      - "Clique com o botao direito para chamar um raio."
      - "Mire longe. Serio."
    brilho: true
    cooldown-segundos: 8
    poderes:
      - tipo: RAIO
        alcance: 40

  cajado-do-vazio:
    nome: "Cajado do Vazio"
    cor: "#B388FF"
    material: ENDER_EYE
    modelo: itensdaniel:cajado-do-vazio
    descricao:
      - "Clique com o botao direito para aparecer no bloco mirado."
    brilho: true
    cooldown-segundos: 5
    poderes:
      - tipo: TELEPORTE
        alcance: 30

  chama-de-daniel:
    nome: "Chama de Daniel"
    cor: "#FF7043"
    material: BLAZE_POWDER
    modelo: itensdaniel:chama-de-daniel
    descricao:
      - "Clique com o botao direito para lancar uma bola de fogo."
      - "Explode sem destruir o terreno."
    brilho: true
    cooldown-segundos: 4
    poderes:
      - tipo: BOLA_DE_FOGO
        potencia: 2.0
        velocidade: 1.6
        incendiario: false
        quebra-blocos: false

  coracao-de-daniel:
    nome: "Coracao de Daniel"
    cor: "#FF5252"
    material: TOTEM_OF_UNDYING
    modelo: itensdaniel:coracao-de-daniel
    descricao:
      - "Clique com o botao direito para curar tres coracoes."
    cooldown-segundos: 45
    poderes:
      - tipo: CURA
        fator: 6.0

  botas-do-vento:
    nome: "Botas do Vento"
    cor: "#80DEEA"
    material: NETHERITE_BOOTS
    modelo: itensdaniel:botas-do-vento
    descricao:
      - "Vestidas: voo livre e passo ligeiro."
    brilho: true
    inquebravel: true
    poderes:
      - tipo: VOO
      - tipo: EFEITO
        efeito: speed
        nivel: 2
      - tipo: EFEITO
        efeito: jump_boost
        nivel: 3

  elmo-do-corujao:
    nome: "Elmo do Corujao"
    cor: "#FFD54F"
    material: NETHERITE_HELMET
    modelo: itensdaniel:elmo-do-corujao
    descricao:
      - "Vestido: enxerga no escuro e respira embaixo d'agua."
    brilho: true
    inquebravel: true
    poderes:
      - tipo: EFEITO
        efeito: night_vision
        nivel: 1
      - tipo: EFEITO
        efeito: water_breathing
        nivel: 1
      - tipo: IMA
        alcance: 6.0

  espada-vampira:
    nome: "Espada Vampira"
    cor: "#E53935"
    material: NETHERITE_SWORD
    modelo: itensdaniel:espada-vampira
    descricao:
      - "Cada golpe rouba vida do inimigo e o deixa lento."
    brilho: true
    inquebravel: true
    poderes:
      - tipo: ROUBO_DE_VIDA
        fator: 0.35
      - tipo: CONGELAR
        nivel: 2
        duracao-ticks: 60

  peitoral-espinhoso:
    nome: "Peitoral Espinhoso"
    cor: "#8D6E63"
    material: NETHERITE_CHESTPLATE
    modelo: itensdaniel:peitoral-espinhoso
    descricao:
      - "Vestido: quem te bate sai voando."
    inquebravel: true
    poderes:
      - tipo: EMPURRAO
        fator: 1.4
      - tipo: EFEITO
        efeito: resistance
        nivel: 1

  espada-do-infinito:
    nome: "Espada do Infinito"
    cor: "#FF4081"
    material: NETHERITE_SWORD
    modelo: itensdaniel:espada-do-infinito
    descricao:
      - "Espada, machado e picareta na mesma lamina."
      - "Botao esquerdo quebra ate bedrock."
      - "Rouba vida, deixa voar e triplica os coracoes."
    brilho: true
    inquebravel: true
    multiferramenta: true
    cooldown-segundos: 6
    atributos:
      # Os dois primeiros repetem o dano e a velocidade da espada de netherita: declarar
      # 'atributos' substitui os do material, entao sem eles a espada bateria como a mao.
      - atributo: attack_damage
        valor: 9.0
        operacao: ADD_NUMBER
        slot: mainhand
      - atributo: attack_speed
        valor: -2.4
        operacao: ADD_NUMBER
        slot: mainhand
      - atributo: max_health
        valor: 2.0
        operacao: ADD_SCALAR   # soma 2x a vida base: 10 coracoes viram 30
        slot: hand
    poderes:
      - tipo: QUEBRA_INDESTRUTIVEL
      - tipo: ROUBO_DE_VIDA
        fator: 0.5
      - tipo: IMPULSO
        fator: 1.8
      - tipo: VOO
      # Os quatro efeitos da maca dourada encantada:
      - tipo: EFEITO
        efeito: regeneration
        nivel: 2
      - tipo: EFEITO
        efeito: resistance
        nivel: 1
      - tipo: EFEITO
        efeito: fire_resistance
        nivel: 1
      - tipo: EFEITO
        efeito: absorption
        nivel: 4

  picareta-do-infinito:
    nome: "Picareta do Infinito"
    cor: "#40C4FF"
    material: NETHERITE_PICKAXE
    modelo: itensdaniel:picareta-do-infinito
    descricao:
      - "Quebra 3x3 e ja entrega o minerio fundido."
      - "Acende o caminho, puxa os drops e deixa voar."
      - "Triplica os coracoes."
    brilho: true
    inquebravel: true
    multiferramenta: true
    atributos:
      - atributo: attack_damage
        valor: 6.0
        operacao: ADD_NUMBER
        slot: mainhand
      - atributo: attack_speed
        valor: -2.8
        operacao: ADD_NUMBER
        slot: mainhand
      - atributo: max_health
        valor: 2.0
        operacao: ADD_SCALAR
        slot: hand
    poderes:
      - tipo: AREA
        alcance: 1        # raio 1 = 3x3
      - tipo: FUNDIR
      - tipo: LUZ
      - tipo: IMA
        alcance: 8.0
      - tipo: VOO
      - tipo: EFEITO
        efeito: regeneration
        nivel: 2
      - tipo: EFEITO
        efeito: resistance
        nivel: 1
      - tipo: EFEITO
        efeito: fire_resistance
        nivel: 1
      - tipo: EFEITO
        efeito: absorption
        nivel: 4
